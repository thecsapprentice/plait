# Local development and testing only: a Plait server and its database.
#
#   docker compose up --build -d                         # start; board at http://localhost:8080/
#   docker compose exec server plait-server make-admin NAME
#   docker compose --profile demo run --build --rm seed  # fill an empty database with demo data
#   docker compose logs -f server
#   docker compose down                                  # stop (add -v to delete the database)
#
# Not a production setup. The board is served over plain HTTP, which browsers
# only accept for its Secure session cookie on localhost. In production, put
# it behind HTTPS and set a real database password.

name: plait

services:
  db:
    image: postgres:16-trixie
    environment:
      POSTGRES_USER: plait
      POSTGRES_PASSWORD: ${PLAIT_DB_PASSWORD:-plait-local-dev}
      POSTGRES_DB: plait
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plait -d plait"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  server:
    build:
      context: .
      target: server
    image: plait-server:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      PLAIT_DATABASE_URL: postgres://plait:${PLAIT_DB_PASSWORD:-plait-local-dev}@db/plait
      PLAIT_DOMAIN: ${PLAIT_DOMAIN:-localhost}
      PLAIT_REGISTRATION_OPEN: ${PLAIT_REGISTRATION_OPEN:-true}
      PLAIT_TAG_POLICY: ${PLAIT_TAG_POLICY:-open}
      # A list of reserved persona handles, synced at every start. To use one,
      # uncomment these lines and the volume below, and put the file next to
      # this one as reserved-handles.txt.
      # PLAIT_RESERVED_HANDLES_FILE: /etc/plait/reserved-handles.txt
    # volumes:
    #   - ./reserved-handles.txt:/etc/plait/reserved-handles.txt:ro
    ports:
      # Bound to this machine only; change PLAIT_PORT if 8080 is taken.
      - "127.0.0.1:${PLAIT_PORT:-8080}:8080"
    restart: unless-stopped

  # Demo data, only when asked for: `docker compose --profile demo run --build --rm seed`.
  # Add options after `seed`, e.g. `--prompts 300 --seed 7`; `--help` lists them.
  seed:
    profiles: [demo]
    build:
      context: .
      target: seed
    image: plait-seed:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      PLAIT_DATABASE_URL: postgres://plait:${PLAIT_DB_PASSWORD:-plait-local-dev}@db/plait
      PLAIT_TAG_POLICY: ${PLAIT_TAG_POLICY:-open}

volumes:
  db-data:
