# cargo audit configuration. Keep in step with deny.toml's [advisories]
# ignore list, which explains each entry.
#
# cargo audit also reads optional dependencies that are listed in
# Cargo.lock but never built. RUSTSEC-2026-0330 and -0331 (libcrux-kem) are
# such: hpke-rs lists its libcrux backend as an optional dependency, and
# OpenMLS's RustCrypto provider doesn't enable it (`cargo tree --target all
# -e all -i hpke-rs-libcrux` prints nothing). cargo deny, which follows the
# real build graph, doesn't report them.
#
# RUSTSEC-2026-0459 (libsqlite3-sys 0.37, a C SQLite bug) is the same case:
# sqlx-macros lists its SQLite driver as optional, and Quill only enables
# Postgres (`cargo tree --target all -e all -i libsqlite3-sys` prints
# nothing). sqlx 0.9.1 still needs libsqlite3-sys 0.37; drop this entry
# once sqlx moves to 0.39 or later.
[advisories]
ignore = [
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
  "RUSTSEC-2026-0173",
  "RUSTSEC-2026-0374",
  "RUSTSEC-2026-0387",
  "RUSTSEC-2025-0057",
  "RUSTSEC-2024-0436",
  "RUSTSEC-2024-0370",
  "RUSTSEC-2024-0429",
  "RUSTSEC-2026-0097",
  "RUSTSEC-2026-0249",
  "RUSTSEC-2026-0330",
  "RUSTSEC-2026-0331",
  "RUSTSEC-2026-0459",
]
