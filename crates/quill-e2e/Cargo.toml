[package]
name = "quill-e2e"
description = "End-to-end tests: real server, real Postgres, driven through quill-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
quill-core.workspace = true
quill-proto.workspace = true
quill-server.workspace = true
# For `quill-seed-sessions`, which makes app windows' stores (#100).
quill-gui.workspace = true
quill-ui.workspace = true

anyhow.workspace = true
clap.workspace = true
axum.workspace = true
sqlx.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
quill-core = { workspace = true, features = ["test-tools"] }
ed25519-dalek.workspace = true
quill-certs = { workspace = true, features = ["sign"] }
reqwest = { workspace = true, features = ["rustls"] }
url.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
# The desktop app driven by its test driver, without its window.
quill-ui = { workspace = true, features = ["testing"] }
tempfile = "3"
# Checks the server's answers against the OpenAPI file.
boon = "0.6"

[lints]
workspace = true
